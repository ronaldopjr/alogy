name: AdSense U35 Inventory Consolidation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/adsense-u35-consolidate-inventory.yml

permissions:
  contents: write

concurrency:
  group: adsense-u35-inventory
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Validate and consolidate 18 E06 deltas
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import csv
          import hashlib
          import os

          base = Path('adsense-recovery')
          canonical = base / 'ADSENSE-INVENTORY.csv'
          if not canonical.exists():
              raise SystemExit('canonical inventory missing')

          raw = canonical.read_text(encoding='utf-8')
          before_sha = hashlib.sha256(raw.encode('utf-8')).hexdigest()
          lines = raw.splitlines(keepends=True)
          if len(lines) < 2:
              raise SystemExit('canonical inventory is unexpectedly short')

          header_text = lines[0].rstrip('\r\n')
          header = next(csv.reader([header_text]))
          if not header or header[0] != 'path':
              raise SystemExit('unexpected canonical header')
          expected_cols = len(header)
          eol = '\r\n' if lines[0].endswith('\r\n') else '\n'

          canonical_index = {}
          for idx, physical_line in enumerate(lines[1:], start=1):
              text = physical_line.rstrip('\r\n')
              row = next(csv.reader([text]))
              if len(row) != expected_cols:
                  raise SystemExit(f'canonical row {idx + 1} has {len(row)} cols; expected {expected_cols}')
              path = row[0]
              if not path:
                  raise SystemExit(f'canonical row {idx + 1} has empty path')
              if path in canonical_index:
                  raise SystemExit(f'duplicate canonical path: {path}')
              canonical_index[path] = idx

          delta_rows = {}
          delta_sources = {}
          for n in range(1, 19):
              delta = base / f'E06-INVENTORY-DELTA-{n:02d}.csv'
              if not delta.exists():
                  raise SystemExit(f'missing delta: {delta.name}')
              d_raw = delta.read_text(encoding='utf-8')
              d_lines = d_raw.splitlines(keepends=True)
              if len(d_lines) != 2:
                  raise SystemExit(f'{delta.name}: expected exactly header + one data row, got {len(d_lines)} physical lines')
              if d_lines[0].rstrip('\r\n') != header_text:
                  raise SystemExit(f'{delta.name}: header differs from canonical')
              data_text = d_lines[1].rstrip('\r\n')
              row = next(csv.reader([data_text]))
              if len(row) != expected_cols:
                  raise SystemExit(f'{delta.name}: data row has {len(row)} cols; expected {expected_cols}')
              path = row[0]
              if path in delta_rows:
                  raise SystemExit(f'duplicate path across deltas: {path}')
              if path not in canonical_index:
                  raise SystemExit(f'{delta.name}: path not found in canonical inventory: {path}')
              delta_rows[path] = row
              delta_sources[path] = (delta.name, data_text)

          if len(delta_rows) != 18:
              raise SystemExit(f'expected 18 unique delta paths, got {len(delta_rows)}')

          before_line_count = len(lines)
          for path, (source_name, data_text) in delta_sources.items():
              lines[canonical_index[path]] = data_text + eol

          merged = ''.join(lines)
          merged_lines = merged.splitlines(keepends=True)
          if len(merged_lines) != before_line_count:
              raise SystemExit('line count changed during consolidation')
          if merged_lines[0].rstrip('\r\n') != header_text:
              raise SystemExit('header changed during consolidation')

          seen = {}
          for idx, physical_line in enumerate(merged_lines[1:], start=1):
              row = next(csv.reader([physical_line.rstrip('\r\n')]))
              if len(row) != expected_cols:
                  raise SystemExit(f'merged row {idx + 1} has invalid column count')
              path = row[0]
              if path in seen:
                  raise SystemExit(f'duplicate merged path: {path}')
              seen[path] = row

          if len(seen) != len(canonical_index):
              raise SystemExit('canonical path count changed')
          for path, expected_row in delta_rows.items():
              if seen.get(path) != expected_row:
                  raise SystemExit(f'merged row does not match delta for {path}')

          canonical.write_text(merged, encoding='utf-8', newline='')
          after_sha = hashlib.sha256(merged.encode('utf-8')).hexdigest()

          report = base / 'E06-INVENTORY-CONSOLIDATION.md'
          report_lines = [
              '# E06 — consolidação integral do inventário',
              '',
              f'- Commit de gatilho: `{os.environ.get("GITHUB_SHA", "unknown")}`',
              '- Deltas aplicados: `E06-INVENTORY-DELTA-01.csv` a `E06-INVENTORY-DELTA-18.csv`.',
              f'- Linhas físicas preservadas: **{before_line_count}**.',
              f'- Paths canônicos únicos preservados: **{len(canonical_index)}**.',
              '- Cabeçalho preservado sem alteração.',
              '- Cada um dos 18 paths foi encontrado exatamente uma vez no inventário canônico.',
              '- Cada linha consolidada foi comparada com o respectivo delta após parse CSV.',
              f'- SHA-256 antes: `{before_sha}`',
              f'- SHA-256 depois: `{after_sha}`',
              '',
              '## Paths consolidados',
              '',
          ]
          for path in sorted(delta_rows):
              report_lines.append(f'- `{path}` — {delta_sources[path][0]}')
          report_lines += [
              '',
              '## Regra de segurança',
              '',
              'A consolidação aborta antes do commit se faltar delta, houver cabeçalho divergente, path ausente/duplicado, contagem de colunas inválida, mudança de contagem de linhas ou divergência entre a linha final e o delta correspondente.',
              '',
          ]
          report.write_text('\n'.join(report_lines), encoding='utf-8')

          print(f'U35 validated: {len(delta_rows)} deltas; {len(canonical_index)} canonical paths; {before_line_count} physical lines')
          print(f'before={before_sha}')
          print(f'after={after_sha}')
          PY

      - name: Abort on concurrent main advance
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          remote_sha="$(git rev-parse origin/main)"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "main advanced concurrently: trigger=$GITHUB_SHA remote=$remote_sha"
            exit 2
          fi

      - name: Commit validated consolidation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adsense-recovery/ADSENSE-INVENTORY.csv adsense-recovery/E06-INVENTORY-CONSOLIDATION.md
          if git diff --cached --quiet; then
            echo "No inventory changes to commit."
            exit 0
          fi
          git commit -m "AdSense U35: consolida deltas E06 no inventario"
          git push origin HEAD:main
