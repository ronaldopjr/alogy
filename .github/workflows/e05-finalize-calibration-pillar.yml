name: E05 finalize calibration pillar pilot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/e05-finalize-calibration-pillar.yml'

permissions:
  contents: write

concurrency:
  group: e05-finalize-calibration-pillar
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate canonical inventory
        run: python3 adsense-recovery/audit_adsense.py

      - name: Classify revised page and write report
        shell: python
        run: |
          from pathlib import Path
          import csv
          import io
          import subprocess

          inventory = Path('adsense-recovery/ADSENSE-INVENTORY.csv')
          report = Path('adsense-recovery/E05-CALIBRATION-PILLAR-PILOT-02.md')
          target_path = 'blog-calibracao-instrumentos-industriais.html'

          prior_csv = subprocess.check_output(
              ['git', 'show', 'HEAD:adsense-recovery/ADSENSE-INVENTORY.csv'],
              text=True,
          )
          prior_row = next(
              row for row in csv.DictReader(io.StringIO(prior_csv))
              if row['path'] == target_path
          )

          with inventory.open(encoding='utf-8', newline='') as stream:
              reader = csv.DictReader(stream)
              rows = list(reader)
              fields = list(reader.fieldnames or [])

          target = next(row for row in rows if row['path'] == target_path)
          target.update({
              'status': 'keep',
              'priority': 'P1',
              'confidence': 'high',
              'evidence': (
                  'Segunda página do piloto E05 revisada em profundidade: alinha calibração, verificação, ajuste '
                  'e teste funcional ao VIM; delimita a fronteira do sistema de medição; separa erro, correção, '
                  'incerteza, tolerância e regra de decisão; explica rastreabilidade como propriedade do resultado; '
                  'compara bancada, campo e teste de loop; apresenta planejamento, exemplo as-found/as-left, fontes '
                  'de incerteza, intervalos, registros, erros comuns, arquitetura de links, CTA comercial condicionado '
                  'ao escopo e referências primárias BIPM/JCGM, ILAC e NIST.'
              ),
              'next_action': (
                  'Manter indexada como página-pilar; monitorar desempenho e preservar fontes, limites metrológicos '
                  'e posicionamento comercial verdadeiro. Usar a página para distribuir navegação interna aos '
                  'conteúdos específicos e adicionar autoria ou revisão técnica pessoal somente após confirmação '
                  'das credenciais e evidências publicáveis.'
              ),
          })

          with inventory.open('w', encoding='utf-8', newline='') as stream:
              writer = csv.DictWriter(stream, fieldnames=fields, lineterminator='\n')
              writer.writeheader()
              writer.writerows(rows)

          content_rows = [row for row in rows if not row['path'].startswith('google')]
          indexable = [row for row in content_rows if 'noindex' not in row['robots'].lower()]
          noindex = [row for row in content_rows if 'noindex' in row['robots'].lower()]
          sitemap_rows = [row for row in content_rows if row['in_sitemap'] == 'true']
          h1_anomalies = [row['path'] for row in indexable if row['h1_count'] != '1']

          report.write_text(
              '# E05 — Piloto editorial 02: página-pilar de calibração\n\n'
              'Data: 2026-09-14\n\n'
              '## Página revisada\n\n'
              f'- `{target_path}`\n'
              '- Commit do conteúdo: `76da655088462ca57846096cadb3ac896840ac4f`.\n\n'
              '## Problema de partida\n\n'
              f'A versão anterior registrava **{prior_row.get("visible_words", "não informado")} palavras visíveis** '
              'no inventário e funcionava como introdução, mas permanecia genérica. Não apresentava exemplo numérico '
              'completo, separação suficiente entre erro, incerteza, tolerância e regra de decisão, nem referências '
              'primárias abrangentes para vocabulário, incerteza e conformidade.\n\n'
              '## O que foi acrescentado\n\n'
              '- terminologia de calibração, verificação, ajuste, teste funcional e teste de loop;\n'
              '- definição explícita da fronteira do sistema de medição;\n'
              '- separação entre erro, correção, incerteza, tolerância e regra de decisão;\n'
              '- explicação de rastreabilidade como propriedade do resultado, não do instrumento;\n'
              '- comparação entre bancada, campo, teste de loop e teste funcional;\n'
              '- sequência de planejamento em oito etapas;\n'
              '- exemplo fictício de transmissor de 0 a 10 bar com as-found e as-left;\n'
              '- fontes possíveis de incerteza e limites de uma lista sem orçamento formal;\n'
              '- orientação sobre declaração de conformidade e intervalos de calibração;\n'
              '- requisitos de registro e tabela de erros comuns;\n'
              '- arquitetura interna para artigos e ferramentas de calibração;\n'
              '- CTA verdadeiro para avaliação, manutenção, teste de loop e conferência funcional sob escopo;\n'
              '- FAQ e referências oficiais BIPM/JCGM, ILAC e NIST.\n\n'
              '## Validação da página\n\n'
              f'- palavras visíveis totais no auditor: **{target["visible_words"]}**;\n'
              f'- palavras visíveis no conteúdo principal: **{target["main_visible_words"]}**;\n'
              f'- H1: **{target["h1_count"]}**; H2: **{target["h2_count"]}**; H3: **{target["h3_count"]}**;\n'
              f'- AdSense direto: **{target["adsense"]}**; sitemap: **{target["in_sitemap"]}**;\n'
              f'- canonical: `{target["canonical"]}`;\n'
              '- JSON-LD de BlogPosting e FAQ validado antes da publicação;\n'
              '- nenhuma fórmula ou lógica JavaScript técnica compartilhada foi alterada.\n\n'
              '## Inventário estrutural após a revisão\n\n'
              f'- HTMLs-fonte: **{len(rows)}**;\n'
              f'- páginas/rotas editoriais: **{len(content_rows)}**;\n'
              f'- indexáveis: **{len(indexable)}**;\n'
              f'- `noindex`: **{len(noindex)}**;\n'
              f'- URLs em sitemap: **{len(sitemap_rows)}**;\n'
              f'- anomalias reais de H1 entre indexáveis: **{len(h1_anomalies)}**.\n\n'
              '## Decisão editorial\n\n'
              'A página passa de `improve/P0` para `keep/P1/high`. Com as duas páginas selecionadas publicadas e '
              'validadas, o piloto E05 pode ser consolidado. A solicitação de nova análise do AdSense permanece '
              'bloqueada até as etapas de autoria, experiência móvel, privacidade/anúncios e prontidão.\n',
              encoding='utf-8',
          )

      - name: Validate bounded result
        shell: python
        run: |
          from pathlib import Path
          import csv
          import json
          import re
          import subprocess

          target_path = 'blog-calibracao-instrumentos-industriais.html'
          inventory_path = Path('adsense-recovery/ADSENSE-INVENTORY.csv')
          page = Path(target_path).read_text(encoding='utf-8')

          with inventory_path.open(encoding='utf-8', newline='') as stream:
              rows = list(csv.DictReader(stream))
          target = next(row for row in rows if row['path'] == target_path)
          content_rows = [row for row in rows if not row['path'].startswith('google')]
          indexable = [row for row in content_rows if 'noindex' not in row['robots'].lower()]
          noindex = [row for row in content_rows if 'noindex' in row['robots'].lower()]

          assert len(rows) == 271, len(rows)
          assert len(content_rows) == 270, len(content_rows)
          assert len(indexable) == 221, len(indexable)
          assert len(noindex) == 49, len(noindex)
          assert sum(row['in_sitemap'] == 'true' for row in content_rows) == 221
          assert not [row['path'] for row in indexable if row['h1_count'] != '1']
          assert target['status'] == 'keep'
          assert target['priority'] == 'P1'
          assert target['confidence'] == 'high'
          assert target['adsense'] == 'true'
          assert target['in_sitemap'] == 'true'
          assert target['h1_count'] == '1'
          assert int(target['h2_count']) >= 16
          assert int(target['main_visible_words']) >= 2250
          assert not target['audit_evidence']
          assert 'cursos.html' not in page.lower()
          assert '>cursos<' not in page.lower()
          assert 'hotmart.com' not in page.lower()
          assert page.count('href="/guia/"') == 2
          assert 'jcgm200-2012' in page.lower()
          assert 'jcgm100-2008e' in page.lower()
          assert 'jcgm106-2012' in page.lower()
          assert 'ilac.org/publications-and-resources/ilac-guidance-series/' in page
          assert 'nist.gov/calibrations/traceability' in page
          assert page.count('<h1') == 1
          assert 'Não há promessa automática de certificado próprio.' in page

          json_blocks = re.findall(r'<script[^>]*type="application/ld\+json"[^>]*>(.*?)</script>', page, re.I | re.S)
          assert len(json_blocks) == 2
          for block in json_blocks:
              json.loads(block)

          expected_tracked = {'adsense-recovery/ADSENSE-INVENTORY.csv'}
          expected_untracked = {'adsense-recovery/E05-CALIBRATION-PILLAR-PILOT-02.md'}
          changed_tracked = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          changed_untracked = set(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          assert changed_tracked == expected_tracked, (changed_tracked, expected_tracked)
          assert changed_untracked == expected_untracked, (changed_untracked, expected_untracked)
          subprocess.run(['git', 'diff', '--check'], check=True)
          print('E05 calibration pillar pilot inventory and report validated.')

      - name: Commit inventory and report atomically
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/e05-finalize-calibration-pillar.yml
          git add adsense-recovery/ADSENSE-INVENTORY.csv adsense-recovery/E05-CALIBRATION-PILLAR-PILOT-02.md
          git commit -m 'AdSense E05: fecha pagina-pilar do piloto editorial'
          git pull --rebase origin main
          git push origin HEAD:main
