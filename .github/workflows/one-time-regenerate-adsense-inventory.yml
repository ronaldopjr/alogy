name: One-time regenerate AdSense inventory

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-regenerate-adsense-inventory.yml

permissions:
  contents: write

concurrency:
  group: one-time-regenerate-adsense-inventory
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate canonical inventory
        shell: python
        run: |
          from pathlib import Path
          from html import unescape
          from html.parser import HTMLParser
          import csv
          import io
          import json
          import re

          ROOT = Path('.')
          BASE = 'https://www.alogy.com.br'
          OUTPUT = ROOT / 'adsense-recovery' / 'ADSENSE-INVENTORY.csv'
          REPORT = ROOT / 'adsense-recovery' / 'E04-INVENTORY-REGENERATION.md'
          FIELDS = [
              'path', 'url', 'robots', 'canonical', 'adsense', 'in_sitemap',
              'visible_words', 'h1_count', 'status', 'priority', 'confidence',
              'evidence', 'next_action'
          ]

          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.robots = ''
                  self.canonical = ''
                  self.h1_count = 0
                  self.text_parts = []
                  self.skip_depth = 0

              def handle_starttag(self, tag, attrs):
                  tag = tag.lower()
                  values = {str(k).lower(): (v or '') for k, v in attrs}
                  if tag in {'script', 'style', 'noscript', 'template', 'svg'}:
                      self.skip_depth += 1
                  if tag == 'h1':
                      self.h1_count += 1
                  if tag == 'meta' and values.get('name', '').lower() == 'robots':
                      self.robots = values.get('content', '').strip()
                  if tag == 'link':
                      rel = {item.lower() for item in values.get('rel', '').split()}
                      if 'canonical' in rel:
                          self.canonical = values.get('href', '').strip()

              def handle_startendtag(self, tag, attrs):
                  self.handle_starttag(tag, attrs)
                  if tag.lower() in {'script', 'style', 'noscript', 'template', 'svg'}:
                      self.skip_depth = max(0, self.skip_depth - 1)

              def handle_endtag(self, tag):
                  if tag.lower() in {'script', 'style', 'noscript', 'template', 'svg'}:
                      self.skip_depth = max(0, self.skip_depth - 1)

              def handle_data(self, data):
                  if self.skip_depth == 0 and data.strip():
                      self.text_parts.append(data.strip())

          def is_inventory_html(path: Path) -> bool:
              rel = path.as_posix()
              return not rel.startswith(('adsense-recovery/', '.github/'))

          def route_url(path: Path) -> str:
              rel = path.as_posix()
              if rel == 'index.html':
                  return BASE + '/'
              if rel.endswith('/index.html'):
                  return BASE + '/' + rel[:-len('index.html')]
              return BASE + '/' + rel

          def normalize_robots(value: str) -> str:
              value = re.sub(r'\s+', '', value or '').lower()
              return value or 'index,follow'

          def bool_text(value: bool) -> str:
              return 'true' if value else 'false'

          old_rows = {}
          if OUTPUT.exists():
              with OUTPUT.open('r', encoding='utf-8-sig', newline='') as handle:
                  for row in csv.DictReader(handle):
                      path = (row.get('path') or '').strip()
                      if path:
                          old_rows[path] = row

          sitemap_urls = set()
          sitemap_entries = []
          loc_pattern = re.compile(r'<loc>\s*(.*?)\s*</loc>', re.I | re.S)
          for sitemap in sorted(ROOT.glob('sitemap*.xml')):
              text = sitemap.read_text(encoding='utf-8')
              for match in loc_pattern.findall(text):
                  url = unescape(match).strip()
                  if url.startswith(BASE + '/') and (url.endswith('.html') or url.endswith('/')):
                      sitemap_entries.append((sitemap.name, url))
                      sitemap_urls.add(url)

          html_paths = sorted(path for path in ROOT.rglob('*.html') if is_inventory_html(path))
          if len(html_paths) != 271:
              raise SystemExit(f'Esperados 271 HTMLs-fonte; encontrados {len(html_paths)}.')

          rows = []
          preserved_decisions = 0
          direct_adsense = 0
          legacy_cursos = 0
          hotmart_pages = 0

          for path in html_paths:
              rel = path.as_posix()
              source = path.read_text(encoding='utf-8')
              parser = PageParser()
              try:
                  parser.feed(source)
              except Exception as exc:
                  raise SystemExit(f'Falha ao analisar {rel}: {exc}')

              url = route_url(path)
              robots = normalize_robots(parser.robots)
              canonical = parser.canonical.strip()
              adsense = 'pagead2.googlesyndication.com/pagead/js/adsbygoogle.js' in source
              in_sitemap = url in sitemap_urls
              words = len(re.findall(r"[0-9A-Za-zÀ-ÖØ-öø-ÿ]+(?:[./%+_-][0-9A-Za-zÀ-ÖØ-öø-ÿ]+)*", ' '.join(parser.text_parts)))

              previous = old_rows.get(rel, {})
              status = (previous.get('status') or '').strip()
              priority = (previous.get('priority') or '').strip()
              confidence = (previous.get('confidence') or '').strip()
              evidence = (previous.get('evidence') or '').strip()
              next_action = (previous.get('next_action') or '').strip()
              if status or priority or confidence or evidence or next_action:
                  preserved_decisions += 1

              if rel == 'google00ce371ffda114a1.html':
                  robots = 'verification'
                  status = 'verification_file'
                  priority = 'P2'
                  confidence = 'high'
                  evidence = 'Arquivo de verificação de propriedade do Google; não é conteúdo editorial.'
                  next_action = 'Preservar enquanto necessário à verificação; não incluir em sitemap nem monetizar.'
              elif rel == 'residencial.html':
                  status = 'legacy_redirect'
                  priority = 'P2'
                  confidence = 'high'
                  evidence = 'Rota legada noindex com canonical e redirecionamento para a página única de Serviços.'
                  next_action = 'Preservar apenas como compatibilidade histórica; manter fora do sitemap e da navegação.'
              elif rel == 'cursos.html':
                  status = 'legacy_redirect'
                  priority = priority or 'P2'
                  confidence = confidence or 'high'
                  evidence = 'Rota legada noindex com canonical e redirecionamento para /guia/.'
                  next_action = 'Preservar como compatibilidade histórica; manter fora do sitemap e substituir links internos por /guia/.'
              elif not status:
                  status = 'unclassified'
                  next_action = next_action or 'classify'

              if adsense:
                  direct_adsense += 1
              lower = source.lower()
              if 'cursos.html' in lower or re.search(r'>\s*cursos\s*<', lower):
                  legacy_cursos += 1
              if 'hotmart.com' in lower:
                  hotmart_pages += 1

              rows.append({
                  'path': rel,
                  'url': url,
                  'robots': robots,
                  'canonical': canonical,
                  'adsense': bool_text(adsense),
                  'in_sitemap': bool_text(in_sitemap),
                  'visible_words': str(words),
                  'h1_count': str(parser.h1_count),
                  'status': status,
                  'priority': priority,
                  'confidence': confidence,
                  'evidence': evidence,
                  'next_action': next_action,
              })

          verification_rows = [row for row in rows if row['status'] == 'verification_file']
          content_rows = [row for row in rows if row['status'] != 'verification_file']
          indexable = [row for row in content_rows if 'noindex' not in row['robots']]
          noindex = [row for row in content_rows if 'noindex' in row['robots']]
          in_sitemap_rows = [row for row in content_rows if row['in_sitemap'] == 'true']
          missing_from_sitemap = [row['path'] for row in indexable if row['in_sitemap'] != 'true']
          noindex_in_sitemap = [row['path'] for row in noindex if row['in_sitemap'] == 'true']
          missing_canonical = [row['path'] for row in indexable if not row['canonical']]
          h1_anomalies = [row['path'] for row in indexable if row['h1_count'] != '1']
          duplicate_sitemap_urls = len(sitemap_entries) - len({url for _, url in sitemap_entries})

          expected = {
              'verification': (len(verification_rows), 1),
              'content': (len(content_rows), 270),
              'indexable': (len(indexable), 221),
              'noindex': (len(noindex), 49),
              'sitemap': (len(in_sitemap_rows), 221),
              'missing_from_sitemap': (len(missing_from_sitemap), 0),
              'noindex_in_sitemap': (len(noindex_in_sitemap), 0),
              'missing_canonical': (len(missing_canonical), 0),
              'h1_anomalies': (len(h1_anomalies), 0),
              'duplicate_sitemap_urls': (duplicate_sitemap_urls, 0),
          }
          failures = [f'{name}: {actual} != {wanted}' for name, (actual, wanted) in expected.items() if actual != wanted]
          if failures:
              details = {
                  'missing_from_sitemap': missing_from_sitemap[:20],
                  'noindex_in_sitemap': noindex_in_sitemap[:20],
                  'missing_canonical': missing_canonical[:20],
                  'h1_anomalies': h1_anomalies[:20],
              }
              raise SystemExit('Validação do inventário falhou: ' + '; '.join(failures) + '\n' + json.dumps(details, ensure_ascii=False))

          buffer = io.StringIO(newline='')
          writer = csv.DictWriter(buffer, fieldnames=FIELDS, lineterminator='\n')
          writer.writeheader()
          writer.writerows(rows)
          OUTPUT.write_text(buffer.getvalue(), encoding='utf-8')

          REPORT.write_text(
              '# E04 — Regeneração do inventário canônico do AdSense\n\n'
              'Data: 2026-09-14\n\n'
              '## Universo atual\n\n'
              f'- HTMLs-fonte inventariados: **{len(rows)}**.\n'
              f'- Rotas/páginas editoriais: **{len(content_rows)}**.\n'
              f'- Arquivo de verificação Google: **{len(verification_rows)}**.\n'
              f'- Indexáveis: **{len(indexable)}**.\n'
              f'- `noindex`: **{len(noindex)}**.\n'
              f'- URLs em sitemap: **{len(in_sitemap_rows)}**.\n'
              f'- Duplicidades entre sitemaps: **{duplicate_sitemap_urls}**.\n'
              f'- Carregadores diretos do AdSense: **{direct_adsense}**.\n'
              f'- Páginas-fonte ainda com `Cursos/cursos.html`: **{legacy_cursos}**.\n'
              f'- Páginas-fonte contendo link Hotmart: **{hotmart_pages}**.\n\n'
              '## Regras aplicadas\n\n'
              '- As colunas estruturais foram recalculadas diretamente dos HTMLs e sitemaps atuais.\n'
              '- Decisões editoriais anteriores foram preservadas quando a URL ainda existe.\n'
              '- URLs inexistentes deixaram de integrar o inventário canônico.\n'
              '- Novas URLs sem decisão permanecem `unclassified` para revisão por lote.\n'
              '- `residencial.html` e `cursos.html` são registradas como rotas legadas, não como ofertas editoriais ativas.\n'
              '- Nenhuma página, fórmula ou lógica técnica foi alterada neste lote.\n\n'
              f'- Linhas antigas disponíveis para conciliação: **{len(old_rows)}**.\n'
              f'- Linhas atuais com decisão anterior preservada: **{preserved_decisions}**.\n',
              encoding='utf-8',
          )

          print(json.dumps({
              'rows': len(rows),
              'content': len(content_rows),
              'indexable': len(indexable),
              'noindex': len(noindex),
              'sitemap': len(in_sitemap_rows),
              'legacy_cursos': legacy_cursos,
              'hotmart_pages': hotmart_pages,
              'direct_adsense': direct_adsense,
              'preserved_decisions': preserved_decisions,
          }, ensure_ascii=False))

      - name: Commit canonical inventory and remove temporary workflow
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-regenerate-adsense-inventory.yml
          git add adsense-recovery/ADSENSE-INVENTORY.csv adsense-recovery/E04-INVENTORY-REGENERATION.md
          git commit -m "AdSense E04: substitui inventario canonico regenerado"
          git push origin HEAD:main
