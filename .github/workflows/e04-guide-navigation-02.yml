name: E04 Guide navigation batch 02

# Retry after normalizing pre-existing trailing whitespace in the bounded targets.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/e04-guide-navigation-02.yml'

permissions:
  contents: write

concurrency:
  group: e04-guide-navigation-02
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded migration
        run: python3 adsense-recovery/e04_guide_batch_02.py

      - name: Validate exact scope
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          targets = {
              'blog-calibracao-instrumentos-industriais.html',
              'blog-erro-total-malha-instrumentacao.html',
              'blog-fat-sat-instrumentacao.html',
              'calculadora-diagnostico-4-20ma-hart.html',
              'checklist-teste-de-loop.html',
          }
          expected_tracked = targets | {'adsense-recovery/ADSENSE-INVENTORY.csv'}
          expected_untracked = {'adsense-recovery/E04-GUIDE-NAVIGATION-02.md'}
          changed_tracked = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          changed_untracked = set(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          if changed_tracked != expected_tracked or changed_untracked != expected_untracked:
              raise SystemExit(
                  f'Diff fora do escopo. Tracked esperado={sorted(expected_tracked)} atual={sorted(changed_tracked)}; '
                  f'untracked esperado={sorted(expected_untracked)} atual={sorted(changed_untracked)}'
              )

          for rel in sorted(targets):
              text = Path(rel).read_text(encoding='utf-8')
              lower = text.lower()
              if 'cursos.html' in lower or '>cursos<' in lower:
                  raise SystemExit(f'Referência legada permaneceu em {rel}')
              if 'hotmart.com' in lower or 'class="hotmart"' in lower or "class='hotmart'" in lower:
                  raise SystemExit(f'Atalho social Hotmart permaneceu em {rel}')
              if text.count('href="/guia/"') < 2 or text.count('>Guia</a>') < 2:
                  raise SystemExit(f'Navegação Guia incompleta em {rel}')

          subprocess.run(['git', 'diff', '--check'], check=True)
          assert Path('adsense-recovery/ADSENSE-INVENTORY.csv').stat().st_size > 100000
          assert Path('adsense-recovery/E04-GUIDE-NAVIGATION-02.md').exists()
          print('Escopo validado: 6 arquivos rastreados + 1 relatório novo; 5 páginas técnicas.')

      - name: Commit atomically and remove temporary files
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm adsense-recovery/e04_guide_batch_02.py
          git rm .github/workflows/e04-guide-navigation-02.yml
          git add -A
          git commit -m 'AdSense E04: migra segundo lote de Cursos para Guia'
          git pull --rebase origin main
          git push origin HEAD:main
