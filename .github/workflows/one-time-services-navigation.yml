name: One-time services navigation migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-services-navigation.yml

permissions:
  contents: write

concurrency:
  group: one-time-services-navigation
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consolidate services navigation
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent
          import json
          import re

          root = Path('.')
          changed = []
          nav_replacements = 0

          redirect = dedent('''\
          <!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width,initial-scale=1" />
            <title>Serviços | ALOGY Engenharia</title>
            <meta name="description" content="Os serviços da ALOGY estão reunidos em uma única página de instrumentação, automação e elétrica." />
            <meta name="robots" content="noindex,follow" />
            <link rel="canonical" href="https://www.alogy.com.br/industrial.html" />
            <meta http-equiv="refresh" content="0;url=/industrial.html" />
            <script>
              (() => {
                const destination = `/industrial.html${window.location.search}${window.location.hash}`;
                window.location.replace(destination);
              })();
            </script>
            <style>
              body{margin:0;background:#f3f7fa;color:#15324a;font:16px/1.6 Arial,sans-serif}
              main{max-width:720px;margin:12vh auto;padding:32px;text-align:center}
              a{color:#006bb1;font-weight:700}
            </style>
          </head>
          <body>
            <main>
              <h1>Os serviços da ALOGY estão em uma única página</h1>
              <p>Você será direcionado automaticamente. Se isso não acontecer, <a href="/industrial.html">acesse a página de Serviços</a>.</p>
            </main>
          </body>
          </html>
          ''')

          industrial_link = re.compile(
              r'(<a\b[^>]*\bhref=(["\'])((?:\.\./|/)?industrial\.html)\2[^>]*>)\s*Serviços Industriais\s*(</a>)',
              re.I,
          )
          residential_link = re.compile(
              r'<a\b[^>]*\bhref=(["\'])((?:\.\./|/)?residencial\.html)\1[^>]*>\s*Serviços Residenciais\s*</a>',
              re.I,
          )

          home_slide = re.compile(
              r'\s*<a class="slide" href="residencial\.html".*?</a>',
              re.I | re.S,
          )
          new_slide = dedent('''

                  <a class="slide" href="industrial.html"
                     style="--pos-desktop: 50% 35%;"
                     aria-label="Conhecer apoio de instrumentista sob demanda">
                    <picture class="slide-media" aria-hidden="true">
                      <img src="instrumentacao.webp" alt="Profissional atuando em instrumentação industrial" width="1200" height="800" decoding="async">
                    </picture>

                    <div class="banner-content">
                      <div class="banner-card">
                        <div class="banner-title">Instrumentista sob demanda</div>
                        <div class="banner-desc">
                          Apoio técnico para manutenção, instalação, diagnóstico, documentação e paradas industriais, com disponibilidade e escopo sob consulta.
                        </div>
                        <div class="banner-actions">
                          <span class="btn"><i class="fas fa-user-gear"></i> Conhecer serviços</span>
                        </div>
                      </div>
                    </div>
                  </a>''')

          def is_internal(path: Path) -> bool:
              rel = path.as_posix()
              return (
                  rel.startswith(('adsense-recovery/', '.github/'))
                  or path.name.startswith(('AUDITORIA-', 'RELATORIO-'))
                  or path.name == 'google00ce371ffda114a1.html'
              )

          for path in sorted(root.rglob('*.html')):
              if is_internal(path):
                  continue
              rel = path.as_posix()
              old = path.read_text(encoding='utf-8')

              if path.name == 'residencial.html' and path.parent == root:
                  new = redirect
              else:
                  new = old
                  if path.name == 'index.html' and path.parent == root:
                      new, slide_count = home_slide.subn(new_slide, new, count=1)
                      if slide_count != 1:
                          raise SystemExit(f'Banner antigo da home não localizado: {slide_count}')
                      new = new.replace(
                          'equipamento, falha, local, recursos e documentação necessária. Os serviços residenciais seguem em página própria.',
                          'equipamento, falha, local, recursos e documentação necessária.',
                          1,
                      )
                      new = new.replace(
                          'placeholder="Instrumentação, válvula, atuador, automação, elétrica ou serviço residencial..."',
                          'placeholder="Instrumentação, válvula, atuador, automação, elétrica ou manutenção..."',
                          1,
                      )

                  if path.name == 'sobre.html' and path.parent == root:
                      new = new.replace(
                          '; os serviços residenciais permanecem disponíveis em página própria.',
                          '.',
                          1,
                      )

                  new, n_ind = industrial_link.subn(r'\1Serviços\4', new)
                  new, n_res = residential_link.subn('', new)
                  nav_replacements += n_ind + n_res

                  if path.name == 'index.html' and path.parent == root:
                      new = new.replace(
                          '<a class="btn" href="industrial.html"><i class="fas fa-industry"></i> Serviços industriais</a>',
                          '<a class="btn" href="industrial.html"><i class="fas fa-screwdriver-wrench"></i> Conhecer serviços</a>',
                          1,
                      )

              if new != old:
                  path.write_text(new, encoding='utf-8')
                  changed.append(rel)

          sitemap = root / 'sitemap-institucional.xml'
          sitemap_old = sitemap.read_text(encoding='utf-8')
          sitemap_new, removed = re.subn(
              r'\s*<url>\s*<loc>https://www\.alogy\.com\.br/residencial\.html</loc>\s*</url>',
              '',
              sitemap_old,
              count=1,
          )
          if removed != 1:
              raise SystemExit('URL legada não foi localizada no sitemap institucional.')
          sitemap.write_text(sitemap_new, encoding='utf-8')
          changed.append('sitemap-institucional.xml')

          residual = []
          for path in root.rglob('*.html'):
              if is_internal(path):
                  continue
              if 'residencial' in path.read_text(encoding='utf-8').lower():
                  residual.append(path.as_posix())
          if residual:
              raise SystemExit('Referências residuais encontradas: ' + ', '.join(residual[:20]))

          if len(changed) < 240:
              raise SystemExit(f'Poucos arquivos alterados ({len(changed)}); revisão manual necessária.')

          report = root / 'adsense-recovery' / 'E04-SERVICES-NAVIGATION-01.md'
          report.write_text(
              '# E04 — Consolidação da navegação de Serviços\n\n'
              'Data: 2026-09-14\n\n'
              '- Navegação pública consolidada em uma única entrada **Serviços**, apontando para `industrial.html`.\n'
              '- A entrada e o rótulo **Serviços Residenciais** foram retirados das páginas públicas.\n'
              '- `residencial.html` passou a ser uma rota legada `noindex,follow`, com canonical e redirecionamento para `industrial.html`.\n'
              '- A URL legada foi retirada do sitemap institucional.\n'
              '- O quarto banner da home foi reposicionado para **Instrumentista sob demanda**, com disponibilidade e escopo sob consulta.\n'
              '- Conteúdo técnico, fórmulas e JavaScript das ferramentas não foram alterados.\n\n'
              f'- Arquivos modificados pelo lote: **{len(changed)}**.\n'
              f'- Substituições de navegação registradas: **{nav_replacements}**.\n',
              encoding='utf-8',
          )

          print(json.dumps({'changed_files': len(changed), 'nav_replacements': nav_replacements}, ensure_ascii=False))

      - name: Commit migration
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "AdSense E04: consolida navegacao em Servicos"
          git push origin HEAD:main
