name: E06 FAT SAT publish
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/e06-fat-sat-publish.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate base and publish exact candidate
        shell: bash
        run: |
          set -euo pipefail
          TARGET='blog-fat-sat-instrumentacao.html'
          WORKFLOW='.github/workflows/e06-fat-sat-publish.yml'
          EXPECTED_OLD_BLOB='bc6a3089fdce77a6aba771705d1cb114d2d6720c'
          EXPECTED_NEW_SHA256='cb6f8413f7136a4794527823adbca917bebb5edd5d428e3456fa824894b900c2'
          ACTUAL_OLD_BLOB="$(git hash-object "$TARGET")"
          test "$ACTUAL_OLD_BLOB" = "$EXPECTED_OLD_BLOB"
          cat > /tmp/candidate.gz.b64 <<'B64'

B64
          base64 -d /tmp/candidate.gz.b64 | gzip -dc > /tmp/candidate.html
          ACTUAL_NEW_SHA256="$(sha256sum /tmp/candidate.html | awk '{print $1}')"
          test "$ACTUAL_NEW_SHA256" = "$EXPECTED_NEW_SHA256"
          grep -q 'IEC 62381:2024' /tmp/candidate.html
          grep -q 'FAQPage' /tmp/candidate.html
          grep -q 'pagead2.googlesyndication.com/pagead/js/adsbygoogle.js' /tmp/candidate.html
          ! grep -qi 'hotmart' /tmp/candidate.html
          ! grep -q '/guia/' /tmp/candidate.html
          ! grep -qi 'cursos.html' /tmp/candidate.html
          cp /tmp/candidate.html "$TARGET"
          rm "$WORKFLOW"
          git config user.name 'ronaldopjr'
          git config user.email 'ronaldopjr@hotmail.com'
          git add "$TARGET" "$WORKFLOW"
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'AdSense E06: aprofunda FAT e SAT de instrumentacao'
          git push origin main