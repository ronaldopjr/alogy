<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Responsive layout review</title><style>body{margin:0;background:#dbe3eb;color:#142e42;font:14px system-ui}header{padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:white}button,select{padding:8px 12px;cursor:pointer}#device{display:block;border:0;margin:18px auto;background:white;max-width:none}#metrics{font:12px monospace}main{overflow:auto}</style></head><body><header><strong>Responsive layout review</strong><button data-width="320">320 px</button><button data-width="360">360 px</button><button data-width="390">390 px</button><button data-width="768">768 px</button><button data-width="1280">1280 px</button><select id="language" aria-label="Language"><option value="calculadora-4-20ma.html">Português</option><option value="4-20ma-calculator.html">English</option></select><button id="measure">Check layout</button><span id="metrics" role="status"></span></header><main><iframe id="device" title="Calculator preview" src="calculadora-4-20ma.html" width="390" height="790"></iframe></main><script>const frame=document.getElementById('device');function measure(){const d=frame.contentDocument,w=frame.contentWindow;document.getElementById('metrics').textContent=JSON.stringify({viewport:w.innerWidth,document:d.documentElement.scrollWidth,overflow:d.documentElement.scrollWidth>w.innerWidth,errors:[...d.querySelectorAll('input[aria-invalid="true"]')].length});}document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{frame.width=b.dataset.width;setTimeout(measure,100)});document.getElementById('language').onchange=e=>frame.src=e.target.value;document.getElementById('measure').onclick=measure;frame.onload=measure;</script></body></html>
